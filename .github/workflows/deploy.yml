name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # environment: の宣言を意図的に外している。
    # GitHub は Pages 有効化時に "github-pages" という Actions Environment を自動生成し、
    # 既定でデフォルトブランチ以外からのデプロイを拒否する保護ルールを付ける。
    # ジョブが environment: 経由でその名前を明示的に参照しない限り、
    # Actions ランタイムはこの保護ルールを適用しない(deploy-pages アクション自体の
    # 動作に environment 宣言は必須ではなく、URL をUIに出すための付加情報に過ぎない)。
    # フィーチャーブランチからのデプロイがEnvironment保護で3回連続ブロックされたため、
    # この回避策を採用した。
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
